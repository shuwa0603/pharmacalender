<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファーマカレンダー | 薬学生専用 就活説明会</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1a6b4a;
    --green-light: #2d9b6f;
    --green-pale: #e8f5ef;
    --cream: #fafaf7;
    --dark: #1a1a1a;
    --gray: #6b7280;
    --border: #e5e7eb;
    --white: #ffffff;
    --drug: #1e5fa8;
    --drug-pale: #e8f0fb;
    --pharmacy: #1a6b4a;
    --pharmacy-pale: #e8f5ef;
    --pharma: #c0392b;
    --pharma-pale: #fdecea;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: var(--green);
  }

  .logo span {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: var(--gray);
    display: block;
    margin-top: -4px;
  }

  .nav-right { display: flex; align-items: center; gap: 12px; }

  .btn {
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }

  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--dark); }
  .btn-outline:hover { border-color: var(--green); color: var(--green); }
  .btn-primary { background: var(--green); color: var(--white); }
  .btn-primary:hover { background: var(--green-light); }

  .hero {
    background: linear-gradient(135deg, var(--green) 0%, #0d4a32 100%);
    color: white;
    padding: 8px 24px;
    text-align: center;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    font-weight: 400;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .hero p { font-size: 14px; opacity: 0.8; font-weight: 300; }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px;
  }

  .list-header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }

  .list-header-title { font-size: 16px; font-weight: 700; }

  .count-badge {
    background: var(--green-pale);
    color: var(--green);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-left: auto;
  }

  .filter-btn {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--white);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--gray);
    transition: all 0.2s;
  }

  .filter-btn.active { background: var(--green); color: white; border-color: var(--green); }

  .filter-wrapper { margin-bottom: 24px; }

  .filter-footer { display: flex; justify-content: flex-end; }

  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-height: 88px;
    overflow: hidden;
    transition: max-height 0.3s ease;
    margin-bottom: 8px;
  }

  .filter-bar.expanded { max-height: 400px; }

  .toggle-filter {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--green);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }

  .toggle-filter:hover { background: var(--green-pale); }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    letter-spacing: 1px;
    margin-bottom: 10px;
    margin-top: 24px;
  }

  .section-label:first-child { margin-top: 0; }

  .event-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 10px;
    display: flex;
    gap: 16px;
    align-items: center;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .event-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); transform: translateY(-1px); }

  .event-date-box {
    background: var(--green-pale);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    min-width: 58px;
    flex-shrink: 0;
  }

  .event-date-box .month { font-size: 10px; color: var(--green); font-weight: 700; }
  .event-date-box .day { font-size: 26px; font-weight: 700; color: var(--green); line-height: 1; }
  .event-date-box .weekday { font-size: 10px; color: var(--gray); margin-top: 2px; }

  .event-info { flex: 1; min-width: 0; }

  .event-company { font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 3px; }

  .category-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge-drug     { background: var(--drug-pale);     color: var(--drug); }
  .badge-pharmacy { background: var(--pharmacy-pale); color: var(--pharmacy); }
  .badge-pharma   { background: var(--pharma-pale);   color: var(--pharma); }

  .card-drug     { border-left: 12px solid var(--drug); }
  .card-pharmacy { border-left: 12px solid var(--pharmacy); }
  .card-pharma   { border-left: 12px solid var(--pharma); }

  .date-drug     { background: var(--drug-pale); }
  .date-pharmacy { background: var(--pharmacy-pale); }
  .date-pharma   { background: var(--pharma-pale); }

  .day-drug     { color: var(--drug); }
  .day-pharmacy { color: var(--pharmacy); }
  .day-pharma   { color: var(--pharma); }

  .apply-drug     { background: var(--drug); }
  .apply-pharmacy { background: var(--pharmacy); }
  .apply-pharma   { background: var(--pharma); }

  .event-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }

  .event-meta { display: flex; gap: 12px; flex-wrap: wrap; }

  .event-tag { font-size: 11px; color: var(--gray); }

  /* 申込ボタン共通 */
  .btn-apply {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    color: white;
  }

  .btn-apply:hover { opacity: 0.85; transform: scale(1.03); }

  /* 申込済みボタン */
  .btn-applied {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    border: 2px solid var(--border);
    cursor: default;
    font-family: 'Noto Sans JP', sans-serif;
    white-space: nowrap;
    background: var(--white);
    color: var(--green);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 48px 32px;
    color: var(--gray);
    font-size: 14px;
    background: var(--white);
    border-radius: 12px;
    border: 1px dashed var(--border);
  }

  /* モーダル共通 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 400px;
    position: relative;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .modal > p { font-size: 13px; color: var(--gray); margin-bottom: 20px; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--gray);
  }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--green); }

  .form-error { color: #dc2626; font-size: 12px; margin-top: 8px; display: none; }

  .user-info { display: flex; align-items: center; gap: 8px; }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  /* ===== 申し込み確認モーダル ===== */
  #applyModal .modal { max-width: 440px; }

  .apply-event-summary {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .apply-event-summary .summary-date-box {
    border-radius: 8px;
    padding: 8px 12px;
    text-align: center;
    min-width: 52px;
    flex-shrink: 0;
  }

  .apply-event-summary .summary-date-box .s-month { font-size: 10px; font-weight: 700; }
  .apply-event-summary .summary-date-box .s-day   { font-size: 22px; font-weight: 700; line-height: 1; }
  .apply-event-summary .summary-date-box .s-week  { font-size: 10px; color: var(--gray); margin-top: 2px; }

  .apply-event-summary .summary-info { flex: 1; }
  .apply-event-summary .summary-company { font-size: 11px; font-weight: 700; color: var(--green); margin-bottom: 3px; }
  .apply-event-summary .summary-title   { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
  .apply-event-summary .summary-format  { font-size: 11px; color: var(--gray); }

  .apply-note {
    font-size: 12px;
    color: var(--gray);
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  .apply-btn-row { display: flex; gap: 10px; }
  .apply-btn-row .btn { flex: 1; padding: 12px; font-size: 14px; text-align: center; }

  /* ===== 完了モーダル ===== */
  .apply-success-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--green-pale);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
  }

  #doneModal .modal { text-align: center; }
  #doneModal h2 { margin-bottom: 8px; }
  #doneModal .done-sub { font-size: 13px; color: var(--gray); margin-bottom: 20px; }
</style>
</head>
<body>

<nav>
  <div class="logo">
    PharmaCalendar
    <span>薬学生専用 就活説明会</span>
  </div>
  <div class="nav-right" id="navRight">
    <button class="btn btn-outline" onclick="openModal('login')">ログイン</button>
    <button class="btn btn-primary" onclick="openModal('signup')">新規登録</button>
  </div>
</nav>

<div class="hero">
  <h1>説明会を<br>まとめて確認</h1>
  <p>薬局・ドラッグストアの説明会を<br>一覧で表示</p>
</div>

<div class="container">
  <div class="list-header">
    <div class="list-header-title">開催予定の説明会</div>
    <div class="count-badge" id="countBadge">0件</div>
  </div>

  <div class="filter-wrapper">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" onclick="filterEvents('all', this)">すべて</button>
    </div>
    <div class="filter-footer">
      <button class="toggle-filter" id="toggleFilter" onclick="toggleFilterBar()">▼ すべて見る</button>
    </div>
  </div>

  <div id="eventList"></div>
</div>

<!-- ===== ログインモーダル ===== -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('login')">×</button>
    <h2>ログイン</h2>
    <p>薬学生アカウントでログイン</p>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="loginEmail" placeholder="example@pharm.ac.jp">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="loginPassword" placeholder="パスワード">
    </div>
    <div class="form-error" id="loginError"></div>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px;margin-top:8px" onclick="handleLogin()">ログイン</button>
    <p style="text-align:center;margin-top:12px;font-size:12px">アカウントがない方は <a href="#" onclick="closeModal('login');openModal('signup')" style="color:var(--green)">新規登録</a></p>
  </div>
</div>

<!-- ===== 新規登録モーダル ===== -->
<div class="modal-overlay" id="signupModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('signup')">×</button>
    <h2>新規登録</h2>
    <p>薬学生専用の就活サービス</p>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="signupEmail" placeholder="example@pharm.ac.jp">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="password" id="signupPassword" placeholder="8文字以上">
    </div>
    <div class="form-group">
      <label>お名前</label>
      <input type="text" id="signupName" placeholder="薬学 太郎">
    </div>
    <div class="form-group">
      <label>大学名</label>
      <input type="text" id="signupUniv" placeholder="○○大学薬学部">
    </div>
    <div class="form-group">
      <label>学年</label>
      <select id="signupYear">
        <option value="">選択してください</option>
        <option value="4">4年生</option>
        <option value="5">5年生</option>
        <option value="6">6年生</option>
      </select>
    </div>
    <div class="form-error" id="signupError"></div>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px;margin-top:8px" onclick="handleSignup()">登録する</button>
    <p style="text-align:center;margin-top:12px;font-size:12px">すでにアカウントをお持ちの方は <a href="#" onclick="closeModal('signup');openModal('login')" style="color:var(--green)">ログイン</a></p>
  </div>
</div>

<!-- ===== 申し込み確認モーダル ===== -->
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('apply')">×</button>
    <h2>説明会に申し込む</h2>
    <p>以下の説明会への参加を申し込みます</p>

    <div class="apply-event-summary" id="applyEventSummary">
      <!-- JS で注入 -->
    </div>

    <div class="apply-note">
      ⚠️ 申し込み後、登録メールアドレスに確認メールが届く場合があります。<br>
      キャンセルは各企業の案内に従ってください。
    </div>

    <div class="apply-btn-row">
      <button class="btn btn-outline" onclick="closeModal('apply')">キャンセル</button>
      <button class="btn btn-primary" id="confirmApplyBtn" onclick="confirmApply()">申し込む</button>
    </div>
    <div class="form-error" id="applyError"></div>
  </div>
</div>

<!-- ===== 申し込み完了モーダル ===== -->
<div class="modal-overlay" id="doneModal">
  <div class="modal">
    <div class="apply-success-icon">✓</div>
    <h2>申し込み完了！</h2>
    <p class="done-sub">説明会への参加申し込みが完了しました。<br>当日のご参加をお待ちしています。</p>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px" onclick="closeModal('done')">閉じる</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hufguvidrswxlhprjyml.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kyQQMZTUlUsC0Vj9ja4m1w_XN7KWXUK';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const MICROCMS_SERVICE_ID = 'pharmacalendar';
const MICROCMS_API_KEY = 'bJyV9hKfeuXjgAGC1dcRW9pGdlDL2JEXkbyd';

let currentUser = null;
let currentFilter = 'all';
let allEvents = [];
let appliedEventIds = new Set(); // 申込済みイベントID
let pendingApplyEvent = null;    // 確認モーダル中のイベント
const weekdays = ['日','月','火','水','木','金','土'];

// ─── Supabase Auth ──────────────────────────────────────────────
db.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user || null;
  updateNav();
  if (currentUser) {
    await loadMyApplications();
    renderList();
  } else {
    appliedEventIds.clear();
    renderList();
  }
});

function updateNav() {
  const nav = document.getElementById('navRight');
  if (currentUser) {
    nav.innerHTML = `
      <div class="user-info">
        <div class="user-avatar">${currentUser.email[0].toUpperCase()}</div>
        <span style="font-size:12px;color:var(--gray)">${currentUser.email}</span>
      </div>
      <button class="btn btn-outline" onclick="handleLogout()">ログアウト</button>
    `;
  } else {
    nav.innerHTML = `
      <button class="btn btn-outline" onclick="openModal('login')">ログイン</button>
      <button class="btn btn-primary" onclick="openModal('signup')">新規登録</button>
    `;
  }
}

// 自分の申し込み済みIDをSupabaseから取得
async function loadMyApplications() {
  if (!currentUser) return;
  const { data, error } = await db
    .from('applications')
    .select('event_id')
    .eq('user_id', currentUser.id);
  if (!error && data) {
    appliedEventIds = new Set(data.map(r => r.event_id));
  }
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = 'メールアドレスまたはパスワードが正しくありません';
    errEl.style.display = 'block';
  } else {
    closeModal('login');
  }
}

async function handleSignup() {
  const email    = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPassword').value;
  const name     = document.getElementById('signupName').value;
  const univ     = document.getElementById('signupUniv').value;
  const year     = document.getElementById('signupYear').value;
  const errEl    = document.getElementById('signupError');
  errEl.style.display = 'none';

  if (!email || !password || !name || !univ || !year) {
    errEl.textContent = 'すべての項目を入力してください';
    errEl.style.display = 'block';
    return;
  }
  if (password.length < 8) {
    errEl.textContent = 'パスワードは8文字以上にしてください';
    errEl.style.display = 'block';
    return;
  }
  const { error } = await db.auth.signUp({
    email, password,
    options: { data: { name, university: univ, year } }
  });
  if (error) {
    errEl.textContent = '登録に失敗しました: ' + error.message;
    errEl.style.display = 'block';
  } else {
    closeModal('signup');
    alert('確認メールを送信しました。メールをご確認ください。');
  }
}

async function handleLogout() {
  await db.auth.signOut();
}

// ─── microCMS ───────────────────────────────────────────────────
async function fetchEvents() {
  const list = document.getElementById('eventList');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray)">読み込み中...</div>';
  try {
    const res = await fetch(
      `https://${MICROCMS_SERVICE_ID}.microcms.io/api/v1/events?limit=100&orders=date`,
      { headers: { 'X-MICROCMS-API-KEY': MICROCMS_API_KEY } }
    );
    const data = await res.json();
    allEvents = data.contents.map(e => ({
      id:         e.id,
      company:    e.company,
      category:   e.category || 'drug',
      title:      e.title,
      date:       e.date,
      format:     e.format,
      formatKey:  e.format && e.format.includes('オンライン') ? 'online' : 'offline',
    }));
    updateFilterButtons();
    renderList();
  } catch(err) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626">データの読み込みに失敗しました</div>';
  }
}

function updateFilterButtons() {
  const companies = [...new Set(allEvents.map(e => e.company))];
  const bar = document.getElementById('filterBar');
  bar.innerHTML = `
    <button class="filter-btn active" onclick="filterEvents('all', this)">すべて</button>
    ${companies.map(c =>
      `<button class="filter-btn" onclick="filterEvents('${c}', this)">${c}</button>`
    ).join('')}
    <button class="filter-btn" onclick="filterEvents('online', this)">オンライン</button>
    <button class="filter-btn" onclick="filterEvents('offline', this)">対面</button>
  `;
}

// ─── フィルター & レンダリング ───────────────────────────────────
function filterEvents(key, btn) {
  currentFilter = key;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function toggleFilterBar() {
  const bar = document.getElementById('filterBar');
  const btn = document.getElementById('toggleFilter');
  bar.classList.toggle('expanded');
  btn.textContent = bar.classList.contains('expanded') ? '▲ 閉じる' : '▼ すべて見る';
}

function renderList() {
  const list = document.getElementById('eventList');
  let filtered = allEvents.filter(e => new Date(e.date) >= new Date());

  if (currentFilter === 'online')       filtered = filtered.filter(e => e.formatKey === 'online');
  else if (currentFilter === 'offline') filtered = filtered.filter(e => e.formatKey === 'offline');
  else if (currentFilter !== 'all')     filtered = filtered.filter(e => e.company === currentFilter);

  filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
  document.getElementById('countBadge').textContent = filtered.length + '件';

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">該当する説明会はありません</div>';
    return;
  }

  const grouped = {};
  filtered.forEach(e => {
    const d = new Date(e.date);
    const key = `${d.getFullYear()}年${d.getMonth()+1}月`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(e);
  });

  const labelMap = { drug: 'ドラッグストア', pharmacy: '調剤薬局', pharma: '製薬会社' };

  list.innerHTML = Object.entries(grouped).map(([month, events]) => `
    <div class="section-label">${month}</div>
    ${events.map(e => {
      const d = new Date(e.date);
      const c = e.category || 'drug';
      const isApplied = appliedEventIds.has(e.id);
      const applyBtn = isApplied
        ? `<span class="btn-applied">✓ 申込済み</span>`
        : `<button class="btn-apply apply-${c}" onclick="openApplyModal('${e.id}')">申し込む</button>`;
      return `
        <div class="event-card card-${c}">
          <div class="event-date-box date-${c}">
            <div class="month day-${c}">${d.getMonth()+1}月</div>
            <div class="day day-${c}">${d.getDate()}</div>
            <div class="weekday">${weekdays[d.getDay()]}曜</div>
          </div>
          <div class="event-info">
            <div class="event-company">
              ${e.company}
              <span class="category-badge badge-${c}">${labelMap[c] || c}</span>
            </div>
            <div class="event-name">${e.title}</div>
            <div class="event-meta">
              <span class="event-tag">📍 ${e.format}</span>
            </div>
          </div>
          ${applyBtn}
        </div>
      `;
    }).join('')}
  `).join('');
}

// ─── 申し込みモーダル ────────────────────────────────────────────
function openApplyModal(eventId) {
  // 未ログインならログインへ誘導
  if (!currentUser) {
    openModal('login');
    return;
  }

  const event = allEvents.find(e => e.id === eventId);
  if (!event) return;
  pendingApplyEvent = event;

  // サマリー描画
  const d = new Date(event.date);
  const c = event.category || 'drug';
  const labelMap = { drug: 'ドラッグストア', pharmacy: '調剤薬局', pharma: '製薬会社' };
  document.getElementById('applyEventSummary').innerHTML = `
    <div class="summary-date-box date-${c}">
      <div class="s-month day-${c}">${d.getMonth()+1}月</div>
      <div class="s-day day-${c}">${d.getDate()}</div>
      <div class="s-week">${weekdays[d.getDay()]}曜</div>
    </div>
    <div class="summary-info">
      <div class="summary-company">${event.company}
        <span class="category-badge badge-${c}">${labelMap[c] || c}</span>
      </div>
      <div class="summary-title">${event.title}</div>
      <div class="summary-format">📍 ${event.format}</div>
    </div>
  `;

  const errEl = document.getElementById('applyError');
  errEl.style.display = 'none';
  document.getElementById('confirmApplyBtn').disabled = false;
  document.getElementById('confirmApplyBtn').textContent = '申し込む';

  openModal('apply');
}

async function confirmApply() {
  if (!currentUser || !pendingApplyEvent) return;

  const btn = document.getElementById('confirmApplyBtn');
  const errEl = document.getElementById('applyError');
  btn.disabled = true;
  btn.textContent = '送信中…';
  errEl.style.display = 'none';

  // 1. Supabaseに申込データを保存
  const { error } = await db.from('applications').insert({
    user_id:     currentUser.id,
    event_id:    pendingApplyEvent.id,
    event_title: pendingApplyEvent.title,
    event_date:  pendingApplyEvent.date,
    company:     pendingApplyEvent.company,
    format:      pendingApplyEvent.format,
  });

  if (error) {
    if (error.code === '23505') {
      errEl.textContent = 'この説明会はすでに申し込み済みです。';
    } else {
      errEl.textContent = '申し込みに失敗しました。もう一度お試しください。';
    }
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '申し込む';
    return;
  }

  // 2. 企業メールをSupabaseから取得
  const { data: companyData } = await db
    .from('company_emails')
    .select('email')
    .eq('company', pendingApplyEvent.company)
    .single();

  // 3. Edge FunctionでResendを呼び出してメール送信
  try {
    await fetch('https://hufguvidrswxlhprjyml.supabase.co/functions/v1/send-email', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_KEY}`,
      },
      body: JSON.stringify({
        studentEmail: currentUser.email,
        company:      pendingApplyEvent.company,
        eventTitle:   pendingApplyEvent.title,
        eventDate:    pendingApplyEvent.date,
        companyEmail: companyData?.email || null,
      }),
    });
  } catch(e) {
    console.error('メール送信エラー:', e);
  }

  // ローカルのSet更新 → 即座にボタン反映
  appliedEventIds.add(pendingApplyEvent.id);
  pendingApplyEvent = null;

  closeModal('apply');
  renderList();
  openModal('done');
}

// ─── モーダル開閉 ────────────────────────────────────────────────
function openModal(type)  { document.getElementById(type + 'Modal').classList.add('active'); }
function closeModal(type) { document.getElementById(type + 'Modal').classList.remove('active'); }

// オーバーレイクリックで閉じる
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      overlay.classList.remove('active');
    }
  });
});

// ─── 初期化 ─────────────────────────────────────────────────────
fetchEvents();
</script>
